name: fedne
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific computing
  - numpy=1.26.4
  - scipy=1.11.4
  - scikit-learn>=0.23.2
  - pandas>=1.4.0
  - matplotlib>=3.5.0
  # Deep learning
  - pytorch>=1.12.0
  - torchvision>=0.13.0
  - cudatoolkit  # Optional: for GPU support
  # Network analysis
  - pip:
    - anndata>=0.11.0
    - annoy>=1.17.0
    - openTSNE>=1.0.0
    - tqdm>=4.64.0
